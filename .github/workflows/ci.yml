name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t house-price-api:ci .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build \
            --build-arg BUILD_SHA=$SHORT_SHA \
            -t pratikt24/house-price-api:latest \
            -t pratikt24/house-price-api:$SHORT_SHA . 
          docker push pratikt24/house-price-api:latest
          docker push pratikt24/house-price-api:$SHORT_SHA

      - name: Trigger Render deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Verify production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          for i in {1..10}; do
            ACTUAL_SHA=$(curl --fail --silent https://house-price-api-v2.onrender.com/version | python -c "import sys, json; print(json.load(sys.stdin).get('build_sha', ''))") || true

            echo "Expected SHA: $SHORT_SHA"
            echo "Production SHA: $ACTUAL_SHA"

            if [ "$ACTUAL_SHA" = "$SHORT_SHA" ]; then
              echo "Production deployment verified"
              exit 0
            fi

            echo "Waiting for new Render deployment..."
            sleep 30
          done

          echo "Production deployment verification failed"
          exit 1

      - name: Verify production prediction
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          RESPONSE=$(curl --fail --silent \
            -X POST https://house-price-api-v2.onrender.com/predict \
            -H "Content-Type: application/json" \
            -d '{"MedInc":8.3252,"HouseAge":41.0,"AveRooms":6.984127,"AveBedrms":1.023810,"Population":322.0,"AveOccup":2.555556,"Latitude":37.88,"Longitude":-122.23}')

          echo "$RESPONSE"

          PREDICTION=$(echo "$RESPONSE" | python -c "import sys, json; print(json.load(sys.stdin).get('predicted_price', ''))")

          if [ -z "$PREDICTION" ]; then
            echo "Production prediction test failed"
            exit 1
          fi

          echo "Production prediction test passed: $PREDICTION"
