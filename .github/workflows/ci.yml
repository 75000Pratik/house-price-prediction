name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t house-price-api:ci .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build \
            -t pratikt24/house-price-api:latest \
            -t pratikt24/house-price-api:$SHORT_SHA .
          docker push pratikt24/house-price-api:latest
          docker push pratikt24/house-price-api:$SHORT_SHA

      - name: Trigger Render deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Smoke test production API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for i in {1..10}; do
            if curl --fail https://house-price-api-v2.onrender.com/health; then
              echo "Production smoke test passed"
              exit 0
            fi

            echo "Waiting for Render deployment..."
            sleep 30
          done

          echo "Production smoke test failed"
          exit 1
